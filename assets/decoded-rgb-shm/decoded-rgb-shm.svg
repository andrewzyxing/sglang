<text x="40" y="608" fill="#2d3142" font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600">Per-engine image ingress · TP=DP=PP=1 · unified or P/D</text>
<text x="40" y="632" fill="#4f5d75" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="400">P/D: separate local objects, boot IDs and receipts; both stages reuse this ingress. Existing KV transfer is not shown.</text>
<text x="40" y="650" fill="#4f5d75" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="400">Native video / audio follow upstream; not enabled. No new per-model adapters or Python processor bridge.</text>
