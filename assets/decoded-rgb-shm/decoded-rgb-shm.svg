<title id="decoded-rgb-shm-native-rust-title">Native Rust RGB shared-memory ingress</title>
<desc id="decoded-rgb-shm-native-rust-desc">The sidecar publishes RGB in a shared volume and sends api.v1 references; bounded Rust snapshots enter existing native image processors, feature buffers and execution, with read receipts for producer cleanup.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #decoded-rgb-shm-native-rust-root { color: #2d3142; font-family: Geist,system-ui,sans-serif; }
      #decoded-rgb-shm-native-rust-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#decoded-rgb-shm-native-rust-root .diagram-container { overflow-x:visible }
